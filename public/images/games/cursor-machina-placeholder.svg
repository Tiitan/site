  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glow)" />
  <rect x="36" y="36" width="1128" height="603" rx="24" fill="none" stroke="#a5b4fc" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="1020" cy="130" r="94" fill="#a5b4fc" fill-opacity="0.12" />
  <circle cx="1080" cy="180" r="34" fill="#a5b4fc" fill-opacity="0.2" />
  <text x="80" y="292" fill="#eef2ff" font-family="Manrope, Segoe UI, sans-serif" font-size="54" font-weight="800">Cursor machina</text>
  <text x="80" y="360" fill="#c7d2fe" font-family="Manrope, Segoe UI, sans-serif" font-size="24" font-weight="600">Game placeholder cover</text>
