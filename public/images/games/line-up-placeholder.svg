  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glow)" />
  <rect x="36" y="36" width="1128" height="603" rx="24" fill="none" stroke="#fdba74" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="1020" cy="130" r="94" fill="#fdba74" fill-opacity="0.12" />
  <circle cx="1080" cy="180" r="34" fill="#fdba74" fill-opacity="0.2" />
