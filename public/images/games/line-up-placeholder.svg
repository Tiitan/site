<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Line up placeholder cover</title>
  <desc id="desc">Placeholder image for Line up game card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0" />
