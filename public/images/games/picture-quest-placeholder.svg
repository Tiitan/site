<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Picture Quest placeholder cover</title>
  <desc id="desc">Placeholder image for Picture Quest game card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glow)" />
  <rect x="36" y="36" width="1128" height="603" rx="24" fill="none" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="1020" cy="130" r="94" fill="#2dd4bf" fill-opacity="0.12" />
  <circle cx="1080" cy="180" r="34" fill="#2dd4bf" fill-opacity="0.2" />
  <text x="80" y="292" fill="#f0fdfa" font-family="Manrope, Segoe UI, sans-serif" font-size="54" font-weight="800">Picture Quest</text>
  <text x="80" y="360" fill="#99f6e4" font-family="Manrope, Segoe UI, sans-serif" font-size="24" font-weight="600">Game placeholder cover</text>
</svg>
