<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tappy tap placeholder cover</title>
  <desc id="desc">Placeholder image for Tappy tap game card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glow)" />
  <rect x="36" y="36" width="1128" height="603" rx="24" fill="none" stroke="#c4b5fd" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="1020" cy="130" r="94" fill="#c4b5fd" fill-opacity="0.12" />
  <circle cx="1080" cy="180" r="34" fill="#c4b5fd" fill-opacity="0.2" />
  <text x="80" y="292" fill="#f5f3ff" font-family="Manrope, Segoe UI, sans-serif" font-size="62" font-weight="800">Tappy tap</text>
  <text x="80" y="360" fill="#ddd6fe" font-family="Manrope, Segoe UI, sans-serif" font-size="24" font-weight="600">Game placeholder cover</text>
</svg>
